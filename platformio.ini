[platformio]
default_envs = esp32s3
src_dir = HeishaMon

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.39
board = esp32-s3-devkitc-1
framework = arduino

; Match the Arduino CLI build used by the repository:
; CDCOnBoot=cdc, PSRAM=enabled, PartitionScheme=min_spiffs
board_build.arduino.memory_type = qio_qspi
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DHEISHAMON_DISABLE_OPENTHERM
    -DHEISHAMON_DISABLE_MQTT_TLS
    -DHEISHAMON_DISABLE_RULES

build_src_filter =
    +<*>
    -<src/opentherm/opentherm.cpp>
    -<rules.cpp>
    -<src/rules/**>

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    knolleary/PubSubClient @ 2.8.0
    bblanchon/ArduinoJson @ ^7.0.0
    https://github.com/milesburton/Arduino-Temperature-Control-Library.git#3.9.0
    paulstoffregen/OneWire @ 2.3.8
    adafruit/Adafruit NeoPixel
